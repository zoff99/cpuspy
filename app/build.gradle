plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bvalosek.cpuspy'
    compileSdk 34

    defaultConfig {
        applicationId "com.bvalosek.cpuspy"
        minSdk 21
        targetSdk 34
        versionCode 20000
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The app uses only standard Android SDK views and APIs; no external dependencies are required.
}
